name: Build APKs

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The runner image already ships the Android SDK; just accept its licenses.
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build release APKs
        run: gradle :app:assembleRelease :launcher:assembleRelease --no-daemon

      - name: Collect files
        run: |
          mkdir dist
          cp app/build/outputs/apk/release/*.apk dist/AbyssFiles.apk
          cp launcher/build/outputs/apk/release/*.apk dist/AbyssHome.apk
          cp bootanimation/bootanimation.zip dist/bootanimation.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Abyss-apks
          path: dist/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Abyss $GITHUB_REF_NAME" \
            --notes "Install on the Switch (Android TV): AbyssHome.apk (launcher) and AbyssFiles.apk (file manager). bootanimation.zip is the optional boot animation (needs root, see bootanimation/README.md)."
